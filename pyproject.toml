[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limit-order-book"
version = "0.1.0"
description = "A limit order book matching engine"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["order_book*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
